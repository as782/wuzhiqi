<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五子棋联机对战</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5efe6; color: #333; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
  h1 { margin: 8px 0 4px; font-size: 26px; }
  .sub { color: #888; font-size: 14px; margin-bottom: 12px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tabs button { padding: 8px 16px; border: 1px solid #d8c9a8; background: #fff; border-radius: 20px; cursor: pointer; font-size: 14px; }
  .tabs button.active { background: #2f2f2f; color: #fff; border-color: #2f2f2f; }
  .panel { background: #fff; border-radius: 12px; padding: 12px 16px; box-shadow: 0 2px 10px rgba(0,0,0,.08); margin-bottom: 12px; width: min(560px, 96vw); text-align: center; }
  .panel input { padding: 9px 12px; font-size: 16px; width: 130px; text-align: center; letter-spacing: 2px; text-transform: uppercase; border: 1px solid #ccc; border-radius: 8px; }
  .btn { padding: 9px 16px; font-size: 14px; border: none; border-radius: 8px; background: #2f2f2f; color: #fff; cursor: pointer; margin: 4px; }
  .btn.light { background: #eee; color: #333; }
  .btn:disabled { opacity: .45; cursor: default; }
  #status { font-size: 15px; min-height: 22px; margin: 4px 0; }
  #score { color: #888; font-size: 13px; }
  canvas { background: #e8b96f; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.18); max-width: 96vw; touch-action: manipulation; cursor: pointer; }
  .roomcode { font-size: 22px; font-weight: bold; letter-spacing: 4px; }
  .hint { font-size: 13px; color: #999; margin-top: 8px; line-height: 1.6; }
  @media (prefers-color-scheme: dark) { body { background: #1c1a17; color: #eee; } .panel { background: #2a2723; } .tabs button { background: #2a2723; color: #eee; border-color: #555; } .btn.light { background: #444; color: #eee; } }
</style>
</head>
<body>
<h1>五子棋联机对战</h1>
<div class="sub">15 × 15 · 黑棋先行 · 五子连珠获胜</div>
<div class="tabs">
  <button id="tabOnline" class="active">联机对战</button>
  <button id="tabLocal">双人同屏</button>
  <button id="tabAi">人机对战</button>
</div>
<div class="panel" id="onlinePanel">
  <div id="roomBox">
    <button class="btn" id="createBtn">创建房间</button>
    <input id="roomInput" maxlength="6" placeholder="房间码">
    <button class="btn" id="joinBtn">加入房间</button>
  </div>
  <div id="roomInfo" style="display:none">
    房间码：<span class="roomcode" id="roomCode"></span>
    <button class="btn light" id="copyBtn">复制邀请链接</button>
    <button class="btn light" id="leaveBtn">离开房间</button>
  </div>
  <div class="hint">把房间码或链接发给对方，对方打开页面输入房间码加入即可。黑棋先行，胜者计 1 分。</div>
</div>
<div id="status">请选择联机 / 双人 / 人机模式</div>
<div id="score"></div>
<canvas id="board" width="560" height="560"></canvas>
<div style="margin-top:12px">
  <button class="btn light" id="undoBtn">悔棋</button>
  <button class="btn light" id="restartBtn">重新开始</button>
</div>
<div class="hint">联机模式：点“重新开始”重开一局（双方换边）。人机/双人模式支持悔棋。</div>
<script>
const SIZE = 15, CELL = 560 / 16;
const canvas = document.getElementById('board'), ctx = canvas.getContext('2d');
let mode = 'online';
let board = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
let turn = 1, winner = 0, winLine = null, lastMove = null;
let myColor = 0, roomCode = '', ws = null, connected = false;
let scores = { black: 0, white: 0 };
let history = [];
const statusEl = document.getElementById('status'), scoreEl = document.getElementById('score');
const params = new URLSearchParams(location.search);
if (params.get('room')) { document.getElementById('roomInput').value = params.get('room').toUpperCase(); }
function draw() {
  ctx.clearRect(0, 0, 560, 560);
  ctx.fillStyle = '#e8b96f'; ctx.fillRect(0, 0, 560, 560);
  ctx.strokeStyle = '#8a6d3b'; ctx.lineWidth = 1;
  for (let i = 0; i < SIZE; i++) {
    ctx.beginPath(); ctx.moveTo(CELL, CELL + i * CELL); ctx.lineTo(CELL + 14 * CELL, CELL + i * CELL); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(CELL + i * CELL, CELL); ctx.lineTo(CELL + i * CELL, CELL + 14 * CELL); ctx.stroke();
  }
  for (const [x, y] of [[3,3],[11,3],[3,11],[11,11],[7,7]]) {
    ctx.beginPath(); ctx.arc(CELL + x * CELL, CELL + y * CELL, 4, 0, Math.PI * 2); ctx.fillStyle = '#8a6d3b'; ctx.fill();
  }
  for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
    if (!board[y][x]) continue;
    const cx = CELL + x * CELL, cy = CELL + y * CELL;
    const g = ctx.createRadialGradient(cx - 5, cy - 6, 2, cx, cy, 15);
    if (board[y][x] === 1) { g.addColorStop(0, '#666'); g.addColorStop(1, '#000'); }
    else { g.addColorStop(0, '#fff'); g.addColorStop(1, '#bbb'); }
    ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.stroke();
  }
  if (lastMove) { ctx.beginPath(); ctx.arc(CELL + lastMove[0] * CELL, CELL + lastMove[1] * CELL, 4, 0, Math.PI * 2); ctx.fillStyle = '#e33'; ctx.fill(); }
  if (winLine) { ctx.strokeStyle = '#e33'; ctx.lineWidth = 3; ctx.beginPath();
    ctx.moveTo(CELL + winLine[0][0] * CELL, CELL + winLine[0][1] * CELL);
    ctx.lineTo(CELL + winLine[4][0] * CELL, CELL + winLine[4][1] * CELL); ctx.stroke(); }
}
function setStatus(t) { statusEl.textContent = t; }
function setScore() { scoreEl.textContent = '黑 ' + scores.black + ' : ' + scores.white + ' 白'; }
function checkWin(x, y, c) {
  for (const [dx, dy] of [[1,0],[0,1],[1,1],[1,-1]]) {
    const line = [[x, y]];
    for (const s of [1, -1]) for (let i = 1; i < 5; i++) {
      const nx = x + dx * i * s, ny = y + dy * i * s;
      if (nx < 0 || ny < 0 || nx >= SIZE || ny >= SIZE || board[ny][nx] !== c) break;
      line.push([nx, ny]);
    }
    if (line.length >= 5) return line.slice(0, 5);
  }
  return null;
}
function place(x, y, c) {
  board[y][x] = c; history.push([x, y, c]); lastMove = [x, y];
  const line = checkWin(x, y, c);
  if (line) { winner = c; winLine = line; scores[c === 1 ? 'black' : 'white']++; }
  else turn = c === 1 ? 2 : 1;
  draw(); setScore();
}
function resetBoard() { board = Array.from({length: SIZE}, () => Array(SIZE).fill(0)); turn = 1; winner = 0; winLine = null; lastMove = null; history = []; draw(); }
function aiMove() {
  const scorePoint = (x, y, c) => {
    let s = 0;
    for (const [dx, dy] of [[1,0],[0,1],[1,1],[1,-1]]) {
      let n = 0, open = 0;
      for (const dir of [1, -1]) { let k = 0;
        for (let i = 1; i < 5; i++) { const nx = x + dx*i*dir, ny = y + dy*i*dir;
          if (nx<0||ny<0||nx>=SIZE||ny>=SIZE) break;
          if (board[ny][nx] === c) k++; else { if (!board[ny][nx]) open++; break; } }
        n += k; }
      s += [0, 10, 100, 1000, 100000][Math.min(n, 4)] * (open ? 1 : 0.3);
    }
    return s + Math.random() * 5;
  };
  let best = null, bestScore = -1;
  for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
    if (board[y][x]) continue;
    const s = Math.max(scorePoint(x, y, 2) * 1.1, scorePoint(x, y, 1));
    if (s > bestScore) { bestScore = s; best = [x, y]; }
  }
  if (best) { place(best[0], best[1], 2); updateStatus(); }
}
function updateStatus() {
  if (winner) { setStatus(winner === 1 ? '黑棋获胜！' : '白棋获胜！'); return; }
  if (mode === 'online') {
    if (!connected) setStatus('未连接：请创建或加入房间');
    else if (myColor === 0) setStatus('观战中 · ' + (turn === 1 ? '黑棋行棋' : '白棋行棋'));
    else setStatus((turn === myColor ? '轮到你了 · ' : '对方行棋中 · ') + (myColor === 1 ? '你是黑棋' : '你是白棋'));
  } else if (mode === 'ai') setStatus(turn === 1 ? '轮到你了（黑棋）' : '电脑思考中…');
  else setStatus(turn === 1 ? '黑棋行棋' : '白棋行棋');
}
function connect() {
  if (ws) ws.close();
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host);
  ws.onopen = () => { connected = true; updateStatus(); };
  ws.onclose = () => { connected = false; setStatus('连接已断开，刷新页面重连'); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'joined') {
      myColor = m.color === 'black' ? 1 : m.color === 'white' ? 2 : 0;
      roomCode = m.room;
      document.getElementById('roomBox').style.display = 'none';
      document.getElementById('roomInfo').style.display = 'block';
      document.getElementById('roomCode').textContent = roomCode;
      history.replaceState(null, '', '?room=' + roomCode);
    } else if (m.type === 'state') {
      board = m.board; turn = m.turn; winner = m.winner; winLine = m.winLine; scores = m.scores;
      history = []; lastMove = null; draw(); setScore(); updateStatus();
    } else if (m.type === 'error') alert(m.message);
  };
}
document.getElementById('createBtn').onclick = () => { connect(); setTimeout(() => ws.send(JSON.stringify({ type: 'create' })), 300); };
document.getElementById('joinBtn').onclick = () => {
  const code = document.getElementById('roomInput').value.trim().toUpperCase();
  if (!code) { alert('请先输入房间码'); return; }
  connect(); setTimeout(() => ws.send(JSON.stringify({ type: 'join', room: code })), 300);
};
document.getElementById('copyBtn').onclick = () => {
  navigator.clipboard.writeText(location.origin + location.pathname + '?room=' + roomCode).then(() => alert('邀请链接已复制'));
};
document.getElementById('leaveBtn').onclick = () => { if (ws) ws.close(); location.href = location.pathname; };
canvas.addEventListener('click', (e) => {
  if (winner) return;
  const r = canvas.getBoundingClientRect();
  const x = Math.round((e.clientX - r.left) / r.width * 560 / CELL - 1);
  const y = Math.round((e.clientY - r.top) / r.height * 560 / CELL - 1);
  if (x < 0 || y < 0 || x >= SIZE || y >= SIZE || board[y][x]) return;
  if (mode === 'online') {
    if (!connected || myColor === 0 || turn !== myColor) return;
    ws.send(JSON.stringify({ type: 'move', x, y }));
  } else {
    place(x, y, turn); updateStatus();
    if (mode === 'ai' && !winner && turn === 2) setTimeout(aiMove, 300);
  }
});
document.getElementById('undoBtn').onclick = () => {
  if (mode === 'online') { alert('联机模式请用“重新开始”重开一局'); return; }
  const steps = mode === 'ai' ? 2 : 1;
  for (let i = 0; i < steps && history.length; i++) {
    const [x, y] = history.pop(); board[y][x] = 0;
  }
  winner = 0; winLine = null; lastMove = history.length ? [history[history.length-1][0], history[history.length-1][1]] : null;
  let n = 0; for (const row of board) for (const c of row) if (c) n++;
  turn = n % 2 === 0 ? 1 : 2; draw(); updateStatus();
};
document.getElementById('restartBtn').onclick = () => {
  if (mode === 'online' && ws && connected) { ws.send(JSON.stringify({ type: 'rematch' })); return; }
  resetBoard(); updateStatus();
};
function setMode(m) {
  mode = m;
  document.getElementById('tabOnline').classList.toggle('active', m === 'online');
  document.getElementById('tabLocal').classList.toggle('active', m === 'local');
  document.getElementById('tabAi').classList.toggle('active', m === 'ai');
  document.getElementById('onlinePanel').style.display = m === 'online' ? 'block' : 'none';
  resetBoard(); scores = { black: 0, white: 0 }; setScore();
  if (m === 'online') { myColor = 0; updateStatus(); } else updateStatus();
}
document.getElementById('tabOnline').onclick = () => setMode('online');
document.getElementById('tabLocal').onclick = () => setMode('local');
document.getElementById('tabAi').onclick = () => setMode('ai');
draw(); setScore(); updateStatus();
if (params.get('room')) setTimeout(() => document.getElementById('joinBtn').click(), 500);
</script>
</body>
</html>
